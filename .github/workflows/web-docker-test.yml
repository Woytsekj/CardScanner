
name: Web Docker Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build web Docker image
        run: docker build -t mtg-scanner-web:test .

      - name: Start test container
        run: |
          mkdir -p "$RUNNER_TEMP/mtg-test-data"

          docker run -d \
            --name mtg-scanner-test \
            -p 127.0.0.1:5000:5000 \
            -e DATA_DIR=/data \
            -e REQUIRE_LOGIN=1 \
            -e SESSION_SECRET=ci-test-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz \
            -e SCANNER_API_KEY=ci-test-scanner-key-0123456789-abcdefghijklmnopqrstuvwxyz \
            -e TRUSTED_HOSTS=127.0.0.1,localhost \
            -e LOCAL_HOSTS=127.0.0.1,localhost \
            -e PUBLIC_HOSTNAME=localhost \
            -e PUBLIC_HTTPS=0 \
            -v "$RUNNER_TEMP/mtg-test-data:/data" \
            mtg-scanner-web:test

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:5000/api/health \
              -o health.json; then
              cat health.json
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed. Container logs:"
          docker logs mtg-scanner-test
          exit 1

      - name: Verify health response
        run: |
          python -c '
          import json
          with open("health.json") as f:
              data = json.load(f)
          assert data.get("success") is True, data
          assert data.get("service") == "mtg-scanner-inventory", data
          print("Web application health check passed.")
          '

      - name: Show logs if test fails
        if: failure()
        run: docker logs mtg-scanner-test

      - name: Clean up
        if: always()
        run: docker rm -f mtg-scanner-test || true
