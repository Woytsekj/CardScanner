
name: Web Docker Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build web Docker image
        run: docker build -t mtg-scanner-web:test .

      - name: Scan Docker image for HIGH and CRITICAL vulnerabilities (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mtg-scanner-web:test
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "0"


      - name: Start test container
        run: |
          mkdir -p "$RUNNER_TEMP/mtg-test-data"

          docker run -d \
            --name mtg-scanner-test \
            -p 127.0.0.1:5000:5000 \
            -e DATA_DIR=/data \
            -e REQUIRE_LOGIN=1 \
            -e SESSION_SECRET=ci-test-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz \
            -e SCANNER_API_KEY=ci-test-scanner-key-0123456789-abcdefghijklmnopqrstuvwxyz \
            -e ADMIN_USERNAME=ci-admin \
            -e ADMIN_PASSWORD=ci-test-admin-password-0123456789-abcdef \
            -e TRUSTED_HOSTS=127.0.0.1,localhost \
            -e LOCAL_HOSTS=127.0.0.1,localhost \
            -e PUBLIC_HOSTNAME=localhost \
            -e PUBLIC_HTTPS=0 \
            -v "$RUNNER_TEMP/mtg-test-data:/data" \
            mtg-scanner-web:test


      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl --silent --show-error \
              --max-time 3 \
              -D health-headers.txt \
              http://127.0.0.1:5000/api/health \
              -o health.json; then
              cat health-headers.txt
              cat health.json

              if python -c '
          import json
          d = json.load(open("health.json"))
          assert d.get("success") is True, d
          assert d.get("service") == "mtg-scanner-inventory", d
          '; then
                exit 0
              fi
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' mtg-scanner-test)" != "true" ]; then
              echo "Container stopped unexpectedly."
              docker inspect mtg-scanner-test \
                --format 'Exit code: {{.State.ExitCode}}; Error: {{.State.Error}}'
              docker logs mtg-scanner-test
              exit 1
            fi

            sleep 2
          done

          echo "Health check timed out."
          cat health-headers.txt 2>/dev/null || true
          cat health.json 2>/dev/null || true
          docker logs mtg-scanner-test
          exit 1


      - name: Verify health response
        run: |
          python -c '
          import json
          with open("health.json") as f:
              data = json.load(f)
          assert data.get("success") is True, data
          assert data.get("service") == "mtg-scanner-inventory", data
          print("Web application health check passed.")
          '

      - name: Test login and authentication
        env:
          BASE_URL: http://127.0.0.1:5000
        run: |
          set -eu

          echo "Testing public login page..."
          login_status=$(curl -sS -o login.html -w "%{http_code}" "$BASE_URL/login")
          test "$login_status" = "200"
          grep -qi '<form' login.html
          echo "PASS: Login page returns HTTP 200."

          echo "Testing protected page..."
          protected_status=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/admin")
          test "$protected_status" = "302"
          echo "PASS: Unauthenticated admin access redirects to login."

          echo "Testing protected API..."
          api_status=$(curl -sS -o protected-api.json -w "%{http_code}" "$BASE_URL/api/price-history/123")
          test "$api_status" = "401"
          echo "PASS: Protected API rejects unauthenticated requests."

      - name: Test CSRF protection
        env:
          BASE_URL: http://127.0.0.1:5000
          CI_ADMIN_USERNAME: ci-admin
          CI_ADMIN_PASSWORD: ci-test-admin-password-0123456789-abcdef
        run: |
          set -eu
          cookie_jar="$RUNNER_TEMP/csrf-cookies.txt"

          echo "Testing login rejects a POST without a CSRF token..."
          curl -sS -c "$cookie_jar" "$BASE_URL/login" -o login-initial.html

          missing_status=$(curl -sS -b "$cookie_jar" -c "$cookie_jar" \
            -o /dev/null -w "%{http_code}" \
            --data-urlencode "username=$CI_ADMIN_USERNAME" \
            --data-urlencode "password=$CI_ADMIN_PASSWORD" \
            "$BASE_URL/login")
          test "$missing_status" = "302"

          still_unauthenticated=$(curl -sS -b "$cookie_jar" -c "$cookie_jar" \
            -o /dev/null -w "%{http_code}" "$BASE_URL/admin")
          test "$still_unauthenticated" = "302"
          echo "PASS: Missing login CSRF token does not authenticate."

          echo "Obtaining a login CSRF token..."
          curl -sS -b "$cookie_jar" -c "$cookie_jar" \
            "$BASE_URL/login" -o login.html
          login_csrf=$(sed -n \
            's/.*<meta name="csrf-token" content="\([^"]*\)".*/\1/p' \
            login.html | head -n 1)
          test -n "$login_csrf"

          login_status=$(curl -sS -b "$cookie_jar" -c "$cookie_jar" \
            -o /dev/null -w "%{http_code}" \
            --data-urlencode "username=$CI_ADMIN_USERNAME" \
            --data-urlencode "password=$CI_ADMIN_PASSWORD" \
            --data-urlencode "csrf_token=$login_csrf" \
            "$BASE_URL/login")
          test "$login_status" = "302"

          admin_status=$(curl -sS -b "$cookie_jar" -c "$cookie_jar" \
            -o admin.html -w "%{http_code}" "$BASE_URL/admin")
          test "$admin_status" = "200"
          echo "PASS: Valid credentials and CSRF token authenticate."

          admin_csrf=$(sed -n \
            's/.*<meta name="csrf-token" content="\([^"]*\)".*/\1/p' \
            admin.html | head -n 1)
          test -n "$admin_csrf"

          echo "Testing invalid CSRF token on logout..."
          invalid_status=$(curl -sS -b "$cookie_jar" -c "$cookie_jar" \
            -X POST -H "X-CSRFToken: invalid-ci-token" \
            -o /dev/null -w "%{http_code}" "$BASE_URL/logout")
          test "$invalid_status" = "400"

          still_authenticated=$(curl -sS -b "$cookie_jar" -c "$cookie_jar" \
            -o /dev/null -w "%{http_code}" "$BASE_URL/admin")
          test "$still_authenticated" = "200"
          echo "PASS: Invalid CSRF token is rejected without logging out."

          echo "Testing logout with a valid CSRF token..."
          logout_status=$(curl -sS -b "$cookie_jar" -c "$cookie_jar" \
            -X POST -H "X-CSRFToken: $admin_csrf" \
            -o /dev/null -w "%{http_code}" "$BASE_URL/logout")
          test "$logout_status" = "302"

          after_logout=$(curl -sS -b "$cookie_jar" -c "$cookie_jar" \
            -o /dev/null -w "%{http_code}" "$BASE_URL/admin")
          test "$after_logout" = "302"
          echo "PASS: Valid CSRF token permits logout and clears the session."

      - name: Test scanner API key
        env:
          BASE_URL: http://127.0.0.1:5000
          SCANNER_API_KEY: ci-test-scanner-key-0123456789-abcdefghijklmnopqrstuvwxyz
        run: |
          set -eu

          echo "Testing scanner API with valid key..."
          valid_status=$(curl -sS \
            -H "X-Scanner-API-Key: $SCANNER_API_KEY" \
            -o scanner-valid.json \
            -w "%{http_code}" \
            "$BASE_URL/api/people")

          test "$valid_status" = "200"
          python -c 'import json; d=json.load(open("scanner-valid.json")); assert d.get("success") is True, d; assert isinstance(d.get("people"), list), d'
          echo "PASS: Valid scanner API key is accepted."

          echo "Testing scanner API with invalid key..."
          invalid_status=$(curl -sS \
            -H "X-Scanner-API-Key: definitely-not-the-correct-key" \
            -o scanner-invalid.json \
            -w "%{http_code}" \
            "$BASE_URL/api/people")

          test "$invalid_status" = "401"
          echo "PASS: Invalid scanner API key is rejected."

      - name: Show logs if test fails
        if: failure()
        run: docker logs mtg-scanner-test

      - name: Clean up
        if: always()
        run: docker rm -f mtg-scanner-test || true
