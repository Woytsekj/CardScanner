
name: Web Docker Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build web Docker image
        run: docker build -t mtg-scanner-web:test .

      - name: Start test container
        run: |
          mkdir -p "$RUNNER_TEMP/mtg-test-data"

          docker run -d \
            --name mtg-scanner-test \
            -p 127.0.0.1:5000:5000 \
            -e DATA_DIR=/data \
            -e REQUIRE_LOGIN=1 \
            -e SESSION_SECRET=ci-test-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz \
            -e SCANNER_API_KEY=ci-test-scanner-key-0123456789-abcdefghijklmnopqrstuvwxyz \
            -e TRUSTED_HOSTS=127.0.0.1,localhost \
            -e LOCAL_HOSTS=127.0.0.1,localhost \
            -e PUBLIC_HOSTNAME=localhost \
            -e PUBLIC_HTTPS=0 \
            -v "$RUNNER_TEMP/mtg-test-data:/data" \
            mtg-scanner-web:test


      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl --silent --show-error \
              --max-time 3 \
              -D health-headers.txt \
              http://127.0.0.1:5000/api/health \
              -o health.json; then
              cat health-headers.txt
              cat health.json

              if python -c '
          import json
          d = json.load(open("health.json"))
          assert d.get("success") is True, d
          assert d.get("service") == "mtg-scanner-inventory", d
          '; then
                exit 0
              fi
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' mtg-scanner-test)" != "true" ]; then
              echo "Container stopped unexpectedly."
              docker inspect mtg-scanner-test \
                --format 'Exit code: {{.State.ExitCode}}; Error: {{.State.Error}}'
              docker logs mtg-scanner-test
              exit 1
            fi

            sleep 2
          done

          echo "Health check timed out."
          cat health-headers.txt 2>/dev/null || true
          cat health.json 2>/dev/null || true
          docker logs mtg-scanner-test
          exit 1


      - name: Verify health response
        run: |
          python -c '
          import json
          with open("health.json") as f:
              data = json.load(f)
          assert data.get("success") is True, data
          assert data.get("service") == "mtg-scanner-inventory", data
          print("Web application health check passed.")
          '

      - name: Test login and authentication
        env:
          BASE_URL: http://127.0.0.1:5000
        run: |
          set -eu

          echo "Testing public login page..."
          login_status=$(curl -sS -o login.html -w "%{http_code}" "$BASE_URL/login")
          test "$login_status" = "200"
          grep -qi '<form' login.html
          echo "PASS: Login page returns HTTP 200."

          echo "Testing protected page..."
          protected_status=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/admin")
          test "$protected_status" = "302"
          echo "PASS: Unauthenticated admin access redirects to login."

          echo "Testing protected API..."
          api_status=$(curl -sS -o protected-api.json -w "%{http_code}" "$BASE_URL/api/price-history/123")
          test "$api_status" = "401"
          echo "PASS: Protected API rejects unauthenticated requests."

      - name: Test scanner API key
        env:
          BASE_URL: http://127.0.0.1:5000
          SCANNER_API_KEY: ci-test-scanner-key-0123456789-abcdefghijklmnopqrstuvwxyz
        run: |
          set -eu

          echo "Testing scanner API with valid key..."
          valid_status=$(curl -sS \
            -H "X-Scanner-API-Key: $SCANNER_API_KEY" \
            -o scanner-valid.json \
            -w "%{http_code}" \
            "$BASE_URL/api/people")

          test "$valid_status" = "200"
          python -c 'import json; d=json.load(open("scanner-valid.json")); assert d.get("success") is True, d; assert isinstance(d.get("people"), list), d'
          echo "PASS: Valid scanner API key is accepted."

          echo "Testing scanner API with invalid key..."
          invalid_status=$(curl -sS \
            -H "X-Scanner-API-Key: definitely-not-the-correct-key" \
            -o scanner-invalid.json \
            -w "%{http_code}" \
            "$BASE_URL/api/people")

          test "$invalid_status" = "401"
          echo "PASS: Invalid scanner API key is rejected."

      - name: Show logs if test fails
        if: failure()
        run: docker logs mtg-scanner-test

      - name: Clean up
        if: always()
        run: docker rm -f mtg-scanner-test || true
