services:
  postgres:
    image: postgres:17-alpine
    container_name: cardscanner-postgres-dev
    profiles: ["postgres-dev"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardscanner_dev}
      POSTGRES_USER: ${POSTGRES_USER:-cardscanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - cardscanner_pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardscanner} -d ${POSTGRES_DB:-cardscanner_dev}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  cardscanner_pg_dev_data:
